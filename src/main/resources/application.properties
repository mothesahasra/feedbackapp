spring.application.name=feedbackapp
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=${PORT:8080}

# Allowed CORS origins for local development and Vercel deployments
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://*.vercel.app

# Reject floating point values for integer fields (e.g., rating: 3.5)
spring.jackson.deserialization.accept-float-as-int=false
